[package]
name = "pso"
description = "Peios Signed Objects: keys, issuing, the trust store and the pso command"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0"
# The same version peios-crypto derives with, so a sealed key file opens in
# either.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
libc = "0.2"
ml-dsa = { version = "0.1", default-features = false }
pso-core = { path = "../pso-core" }
rpassword = "7"
sha2 = "0.10"
unicode-normalization = "0.1"
zeroize = "1"

[dev-dependencies]
tempfile = "3.23"
