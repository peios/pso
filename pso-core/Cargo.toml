[package]
name = "pso-core"
description = "Peios Signed Objects: objects, warrants and verification"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["rustcrypto"]
# SHA-512 and ML-DSA from the RustCrypto crates. A verifier with its own
# implementations, such as a kernel, turns this off and implements `Crypto`.
rustcrypto = ["dep:ml-dsa", "dep:sha2"]

[dependencies]
ml-dsa = { version = "0.1", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
